<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omri Adler — Medical Physics &amp; Research</title>
  <style>
    :root {
      --bg: #f7f8f7;
      --surface: #ffffff;
      --text: #1e292b;
      --muted: #5c6b6e;
      --border: #e3e8e6;
      --accent: #2f5d50;
      --accent-soft: #eaf1ee;
      --link-bg: #eef5fc;
      --link-border: #d4e5f7;
      --link-text: #0a66c2;
      --radius: 10px;
      --max-w: 840px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .site-brand {
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: var(--text);
      padding: 0.95rem 0;
      text-decoration: none;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      appearance: none;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.925rem;
      font-weight: 500;
      padding: 0.95rem 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn[aria-selected="true"] {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      border-radius: 4px;
    }

    main {
      max-width: var(--max-w);
      margin: 2.25rem auto 4rem;
      padding: 0 1.25rem;
    }

    .panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem;
      box-shadow: 0 1px 3px rgba(20, 35, 32, 0.03);
      animation: fadeIn 0.2s ease;
    }

    .panel.is-active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2 {
      margin-top: 0;
      line-height: 1.3;
      letter-spacing: -0.015em;
    }

    h1 {
      font-size: 1.65rem;
      margin-bottom: 0.3rem;
    }

    h2 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
    }

    p {
      margin: 0 0 1rem;
      color: var(--text);
    }

    p:last-child {
      margin-bottom: 0;
    }

    .muted {
      color: var(--muted);
    }

    /* Profile Header */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
    }

    .avatar-wrap {
      flex: 0 0 auto;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .role-line {
      color: var(--accent);
      font-weight: 500;
      font-size: 0.975rem;
      margin-bottom: 0.35rem;
    }

    .profile-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .ext-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--link-text);
      background-color: var(--link-bg);
      border: 1px solid var(--link-border);
      border-radius: 7px;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .ext-link:hover {
      background-color: #e1eefb;
    }

    .ext-link.secondary {
      color: var(--accent);
      background-color: var(--accent-soft);
      border-color: #cde0d8;
    }

    .ext-link.secondary:hover {
      background-color: #dcebe4;
    }

    /* Cards & Lists */
    .item-list {
      display: grid;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      background-color: #fcfdfd;
    }

    .card-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .card-meta {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .sub-roles {
      margin: 0.5rem 0 0;
      padding-left: 1.15rem;
      font-size: 0.925rem;
      color: var(--text);
    }

    .sub-roles li {
      margin-bottom: 0.3rem;
    }

    .pill {
      display: inline-block;
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    /* Contact Form */
    .form-grid {
      display: grid;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    input, textarea {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid #cfd8d5;
      border-radius: 7px;
      padding: 0.65rem 0.8rem;
      transition: border-color 0.15s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn-primary {
      appearance: none;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.7rem 1.25rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .form-status {
      font-size: 0.9rem;
      color: var(--accent);
      margin-top: 0.5rem;
      min-height: 1.2em;
    }

    footer {
      max-width: var(--max-w);
      margin: 0 auto 2.5rem;
      padding: 0 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      .profile-header {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
      }

      .profile-links {
        justify-content: center;
      }

      .panel {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a class="site-brand" href="#about" data-tab-link="about" id="brand-name"></a>
      <nav class="tabs" role="tablist" aria-label="Primary sections">
        <button class="tab-btn" role="tab" id="tab-about" aria-selected="true" aria-controls="panel-about" data-tab="about">About</button>
        <button class="tab-btn" role="tab" id="tab-research" aria-selected="false" aria-controls="panel-research" data-tab="research">Research</button>
        <button class="tab-btn" role="tab" id="tab-projects" aria-selected="false" aria-controls="panel-projects" data-tab="projects">Projects</button>
        <button class="tab-btn" role="tab" id="tab-collaboration" aria-selected="false" aria-controls="panel-collaboration" data-tab="collaboration">Collaboration</button>
        <button class="tab-btn" role="tab" id="tab-contact" aria-selected="false" aria-controls="panel-contact" data-tab="contact">Contact</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- 1. ABOUT (Default) -->
    <section class="panel is-active" id="panel-about" role="tabpanel" aria-labelledby="tab-about">
      <div class="profile-header">
        <div class="avatar-wrap" id="avatar-wrap"></div>
        <div>
          <h1 id="profile-name"></h1>
          <div class="role-line" id="profile-headline"></div>
          <p class="muted" id="profile-tagline"></p>
          <div class="profile-links" id="about-links"></div>
        </div>
      </div>

      <div id="profile-bio"></div>
    </section>

    <!-- 2. RESEARCH -->
    <section class="panel" id="panel-research" role="tabpanel" aria-labelledby="tab-research">
      <span class="pill">Research &amp; Publications</span>
      <h2>Publications &amp; Research Profiles</h2>
      <p class="muted" id="research-intro"></p>
      <div class="profile-links" id="research-links"></div>
      <div class="item-list" id="research-list"></div>
    </section>

    <!-- 3. PROJECTS -->
    <section class="panel" id="panel-projects" role="tabpanel" aria-labelledby="tab-projects">
      <span class="pill">Experience &amp; Projects</span>
      <h2>Academic, Clinical &amp; Engineering Roles</h2>
      <p class="muted" id="projects-intro"></p>
      <div class="item-list" id="projects-list"></div>
    </section>

    <!-- 4. COLLABORATION -->
    <section class="panel" id="panel-collaboration" role="tabpanel" aria-labelledby="tab-collaboration">
      <span class="pill">Collaboration</span>
      <h2>Working Together</h2>
      <p id="collaboration-intro"></p>
      <div class="item-list" id="collaboration-list"></div>
    </section>

    <!-- 5. CONTACT -->
    <section class="panel" id="panel-contact" role="tabpanel" aria-labelledby="tab-contact">
      <span class="pill">Contact</span>
      <h2>Get in Touch</h2>
      <p class="muted" id="contact-intro"></p>
      <div class="profile-links" id="contact-links"></div>

      <form class="form-grid" id="contact-form">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required placeholder="Your name" />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required placeholder="How can we work together?"></textarea>
        </div>
        <div>
          <button class="btn-primary" type="submit">Send Message</button>
          <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
        </div>
      </form>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> <span id="footer-name"></span>
  </footer>

  <script>
    // =========================================================================
    // PARAMETERS SECTION
    // Edit only the values inside PARAMETERS below to update the entire site.
    // =========================================================================
    const PARAMETERS = {
      name: "Omri Adler",
      initials: "OA",
      // Replace with your profile photo URL or local file path (e.g., "profile.jpg"):
      avatarUrl: "profile.jpg",
      headline: "Medical Physicist · Ph.D. in Biomedical Engineering · M.Sc. in Computational Physics",
      tagline: "Ultrasound medical imaging, image processing, analytical algorithms, and teaching.",

      // External profile links
      linkedinUrl: "https://www.linkedin.com/in/omri-adler-0b46ab11b/",
      scholarUrl: "https://scholar.google.com/citations?user=mr5GqVoAAAAJ",
      researchgateUrl: "https://www.researchgate.net/profile/Omri-Adler",

      // About tab paragraphs
      bio: [
        "A Medical Physicist, have a Ph.D. in Biomedical Engineering (medical imaging in ultrasound), M.Sc. in Computational Physics. Focusing on challenging projects and interesting research.",
        "Experienced Matlab programmer in image processing and analyzing algorithms (Also worked with Python and C). A motivated self-learner with strong analytical skills. Passionate about science, technology and solving new problems."
      ],

      // Research tab intro & publications list
      researchIntro: "Selected publications and research profiles (Google Scholar & ResearchGate links update live externally).",
      publications: [
        {
          title: "Perfusion Assessment in CEUS Imaging for Estimating Pancreatic Cancer Response to Sonoporation-Enhanced Chemotherapy",
          meta: "Ultrasonic Imaging · Omri Adler, Priscilla Machado, Trang Vu, Flemming Forsberg, Odd Helge Gilja, Dan Adam",
          description: "Contrast-enhanced ultrasound (CEUS) perfusion analysis using denoising, static-frame selection, spatio-temporal registration, and deconvolution to evaluate treatment response in pancreatic cancer."
        },
        {
          title: "Strain Curve Classification Using Supervised Machine Learning Algorithm with Physiologic Constraints",
          meta: "Ultrasound in Medicine & Biology · Amir Yahav, Grigoriy Zurakhov, Omri Adler, Dan Adam",
          description: "Supervised machine learning classification of strain curves incorporating physiological constraints for cardiac/tissue strain analysis."
        },
        {
          title: "A Study of Vibrating Nanotubes with Additional Adsorbed Masses",
          meta: "Journal of Physics: Conference Series · Joan Adler, Omri Adler",
          description: "Computational and analytical study of vibrational frequency shifts in nanotubes with adsorbed molecular masses."
        }
      ],

      // Projects / Experience tab intro & entries
      projectsIntro: "Roles across clinical medical physics, university teaching, research labs, and algorithm engineering.",
      experience: [
        {
          title: "Medical Physicist — Carmel Medical Center",
          meta: "Full-time · Nov 2026 – Present",
          description: "Clinical medical physics practice and technical support."
        },
        {
          title: "Lecturer — University of Haifa",
          meta: "Part-time · Oct 2025 – Present",
          description: "Higher education teaching and university lecturing."
        },
        {
          title: "Medical Physicist — Rambam Health Care Campus",
          meta: "Internship · Sep 2024 – Aug 2026 (2 yrs)",
          description: "Clinical residency/internship in medical physics."
        },
        {
          title: "Representative of Ph.D. Degree in Bio-Medical Engineering — Technion Student Association (אס\"ט)",
          meta: "Oct 2017 – Dec 2022 (5 yrs 3 mos) · Israel",
          description: "Represented Ph.D. biomedical engineering students at the Technion."
        },
        {
          title: "Lab & Project Instructor — Faculty of Biomedical Engineering, Technion",
          meta: "1 yr 6 mos",
          description: "Instruction across laboratory and annual capstone courses.",
          bullets: [
            "Lab Instructor (Oct 2021 – Mar 2022 · 6 mos): Labs E1, E2 and E3 (Ultrasound, EEG and ECG).",
            "Project Instructor (Oct 2020 – Sep 2021 · 1 yr): Annual Project 1 (Ultrasound Phantom and Deconvolution Algorithms)."
          ]
        },
        {
          title: "Laboratory Assistant — Faculty of Biomedical Engineering, Technion",
          meta: "Part-time · Apr 2018 – Dec 2018 (9 mos) · Haifa, Israel",
          description: "Researcher in Prof. Dan Adam's lab."
        },
        {
          title: "Algorithm Engineer — Bat-Call Medical Device",
          meta: "Mar 2017 – Mar 2018 (1 yr 1 mo) · Nesher",
          description: "Algorithm development for medical device signal/image analysis."
        },
        {
          title: "Representative of Masters Degree in Physics — Technion Student Association (TSA / אס\"ט)",
          meta: "Oct 2013 – Dec 2016 (3 yrs 3 mos) · Israel",
          description: "Represented M.Sc. physics students at the Technion."
        },
        {
          title: "Private Tutor — Technion - Israel Institute of Technology",
          meta: "Oct 2010 – Mar 2016 (5 yrs 6 mos) · Israel",
          description: "Physics and Math lessons."
        },
        {
          title: "Tutor — Technion International",
          meta: "Oct 2013 – Oct 2015 (2 yrs 1 mo) · Israel",
          description: "Physics and Hebrew lessons."
        },
        {
          title: "Laboratory Assistant — Physics@Technion",
          meta: "Part-time · Nov 2014 – Mar 2015 (5 mos) · Haifa, Israel",
          description: "Researcher in Prof. Joan Adler's lab."
        },
        {
          title: "Lab Instructor — Physics@Technion",
          meta: "Apr 2014 – Sep 2014 (6 mos) · Israel",
          description: "Physics 1 and Physics 1h (Kinematics)."
        }
      ],

      // Collaboration tab
      collaborationIntro: "Open to connecting on research initiatives, medical imaging / signal processing challenges, and academic or technical collaborations.",
      collaboration: [
        {
          title: "Medical Imaging & Algorithmic Research",
          description: "Collaborative studies in ultrasound imaging, perfusion/signal analysis, and MATLAB/Python/C algorithm development."
        },
        {
          title: "Clinical & Academic Partnerships",
          description: "Joint research projects, methodological review, and educational initiatives."
        }
      ],

      // Contact tab
      contactIntro: "Connect via LinkedIn, Google Scholar, or ResearchGate, or send a message below."
    };
    // =========================================================================
    // END PARAMETERS SECTION
    // =========================================================================

    function buildProfileLinksHtml(params) {
      const links = [
        { label: "LinkedIn", url: params.linkedinUrl, primary: true },
        { label: "Google Scholar", url: params.scholarUrl, primary: false },
        { label: "ResearchGate", url: params.researchgateUrl, primary: false }
      ].filter((item) => item.url && item.url.trim() !== "");

      return links.map((link) =>
        `<a class="ext-link ${link.primary ? "" : "secondary"}" href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label} ↗</a>`
      ).join("");
    }

    function renderCards(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = items.map((item) => {
        const bulletsHtml = Array.isArray(item.bullets) && item.bullets.length
          ? `<ul class="sub-roles">${item.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`
          : "";
        return `
          <div class="card">
            <div class="card-title">${item.title}</div>
            ${item.meta ? `<div class="card-meta">${item.meta}</div>` : ""}
            ${item.description ? `<p>${item.description}</p>` : ""}
            ${bulletsHtml}
          </div>
        `;
      }).join("");
    }

    function applyParameters(params) {
      document.title = `${params.name} — Medical Physics & Research`;
      document.getElementById("brand-name").textContent = params.name;
      document.getElementById("profile-name").textContent = params.name;
      document.getElementById("footer-name").textContent = params.name;
      document.getElementById("profile-headline").textContent = params.headline;
      document.getElementById("profile-tagline").textContent = params.tagline;

      const linksHtml = buildProfileLinksHtml(params);
      document.getElementById("about-links").innerHTML = linksHtml;
      document.getElementById("research-links").innerHTML = linksHtml;
      document.getElementById("contact-links").innerHTML = linksHtml;

      const avatarWrap = document.getElementById("avatar-wrap");
      avatarWrap.innerHTML = "";
      const img = document.createElement("img");
      img.src = params.avatarUrl;
      img.alt = `Portrait of ${params.name}`;
      img.onerror = () => {
        avatarWrap.innerHTML = `<span style="font-weight:600;color:#2f5d50;font-size:1.5rem;">${params.initials}</span>`;
      };
      avatarWrap.appendChild(img);

      document.getElementById("profile-bio").innerHTML = params.bio
        .map((p) => `<p>${p}</p>`)
        .join("");

      document.getElementById("research-intro").textContent = params.researchIntro;
      renderCards("research-list", params.publications);

      document.getElementById("projects-intro").textContent = params.projectsIntro;
      renderCards("projects-list", params.experience);

      document.getElementById("collaboration-intro").textContent = params.collaborationIntro;
      renderCards("collaboration-list", params.collaboration);

      document.getElementById("contact-intro").textContent = params.contactIntro;
    }

    (function () {
      applyParameters(PARAMETERS);

      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
      const brandLink = document.querySelector('[data-tab-link="about"]');

      function activateTab(tabName, updateHash = true) {
        const valid = tabs.some((t) => t.dataset.tab === tabName);
        const target = valid ? tabName : "about";

        tabs.forEach((tab) => {
          const isSelected = tab.dataset.tab === target;
          tab.setAttribute("aria-selected", String(isSelected));
        });

        panels.forEach((panel) => {
          panel.classList.toggle("is-active", panel.id === "panel-" + target);
        });

        if (updateHash) {
          history.replaceState(null, "", "#" + target);
        }
      }

      tabs.forEach((tab, idx) => {
        tab.addEventListener("click", () => activateTab(tab.dataset.tab));
        tab.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            const next = tabs[(idx + 1) % tabs.length];
            next.focus();
            activateTab(next.dataset.tab);
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            const prev = tabs[(idx - 1 + tabs.length) % tabs.length];
            prev.focus();
            activateTab(prev.dataset.tab);
          }
        });
      });

      if (brandLink) {
        brandLink.addEventListener("click", (e) => {
          e.preventDefault();
          activateTab("about");
        });
      }

      window.addEventListener("hashchange", () => {
        activateTab(location.hash.replace(/^#/, ""), false);
      });

      activateTab(location.hash.replace(/^#/, "") || "about", false);

      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");
      if (form && status) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          status.textContent = "Thank you — your message has been noted locally (connect a form backend to receive submissions).";
          form.reset();
        });
      }

      document.getElementById("year").textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
