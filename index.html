      --muted: #50677a;
      --border: #d4e3ef;
      --accent: #1b5e8a;
      --accent-mid: #2c7bb0;
      --accent-soft: #e3f0fa;
      --error: #a93226;
      --link-bg: #e6f2fc;
      --link-border: #c5def5;
      --link-text: #0f5694;
      --radius: 12px;
      --max-w: 840px;
    }

    * {

    }

    body {
      margin: 0;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    header {

      top: 0;
      z-index: 10;
    }

    .nav-inner {

      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .site-brand {
      font-weight: 600;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      color: var(--accent);
      padding: 0.95rem 0;
      text-decoration: none;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      gap: 0.25rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {

      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.925rem;
      font-weight: 500;
      padding: 0.95rem 0.85rem;

    .tab-btn:hover {

    }

    .tab-btn[aria-selected="true"] {

    }

      border-radius: 4px;
    }

    main {

      margin: 2.25rem auto 4rem;
      padding: 0 1.25rem;
    }

    .panel {
      display: none;
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);

      border-radius: var(--radius);
      padding: 2.25rem;

    }

    .panel.is-active {

    }

    p:last-child {
      margin-bottom: 0;
    }

    .muted {
      color: var(--muted);
    }

      gap: 1.75rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);

      height: 116px;

      align-items: center;
      justify-content: center;

      height: 100%;

    }

      font-size: 0.975rem;
      margin-bottom: 0.35rem;
    }

    .profile-links {

      margin-top: 0.75rem;

      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.22rem 0.68rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;

      font-size: 0.9rem;
      font-weight: 500;
      color: #1c364b;

      height: 1px;

    }

    function buildProfileLinksHtml(params) {
      const links = [
        { label: "LinkedIn", url: params.linkedinUrl, primary: true },
        { label: "Google Scholar", url: params.scholarUrl, primary: false },
        { label: "ResearchGate", url: params.researchgateUrl, primary: false }
      ].filter((item) => item.url && item.url.trim() !== "");

      if (params.contactEmail && params.contactEmail.trim() !== "") {
        links.push({
          label: "Email",
          url: `mailto:${params.contactEmail.trim()}`,
          primary: false
        });
      }

      return links.map((link) => {
        const isMailto = link.url.startsWith("mailto:");
        const targetAttrs = isMailto ? "" : ` target="_blank" rel="noopener noreferrer"`;
        return `<a class="ext-link ${link.primary ? "" : "secondary"}" href="${link.url}"${targetAttrs}>${link.label}${isMailto ? "" : " ↗"}</a>`;
      }).join("");
    }

    function renderCards(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = items.map((item) => {
        const bulletsHtml = Array.isArray(item.bullets) && item.bullets.length
          ? `<ul class="sub-roles">${item.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`
          : "";
        return `
          <div class="card">
            <div class="card-title">${item.title}</div>
            ${item.meta ? `<div class="card-meta">${item.meta}</div>` : ""}
            ${item.description ? `<p>${item.description}</p>` : ""}
            ${bulletsHtml}
          </div>
        `;
      }).join("");
    }

    function setFormStatus(statusEl, type, text) {
      statusEl.className = "form-status" + (type ? ` is-${type}` : "");
      statusEl.textContent = text;
    }

    function setupContactForm(params) {
      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");
      const submitBtn = document.getElementById("submit-btn");
      if (!form || !status || !submitBtn) return;

      const endpoint = (params.contactEndpoint || "").trim();
      const fallbackEmail = (params.contactEmail || "").trim();

      if (endpoint) {
        form.setAttribute("action", endpoint);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        if (formData.get("_gotcha")) {
          form.reset();
          return;
        }

        const name = String(formData.get("name") || "").trim();
        const email = String(formData.get("email") || "").trim();
        const message = String(formData.get("message") || "").trim();

        if (endpoint) {
          submitBtn.disabled = true;
          submitBtn.textContent = "Sending...";
          setFormStatus(status, "info", "Sending your message...");

          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ name, email, message })
            });

            if (response.ok) {
              setFormStatus(status, "success", "Message sent — thank you for reaching out.");
              form.reset();
            } else {
              let errorMsg = "Could not send message. Please try again or reach out via LinkedIn.";
              try {
                const data = await response.json();
                if (data && Array.isArray(data.errors) && data.errors.length) {
                  errorMsg = data.errors.map((err) => err.message).join(" ");
                }
              } catch (_) {}
              setFormStatus(status, "error", errorMsg);
            }
          } catch (_) {
            setFormStatus(
              status,
              "error",
              "Network error while sending. Please check your connection or reach out via LinkedIn."
            );
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Message";
          }
          return;
        }

        if (fallbackEmail) {
          const subject = encodeURIComponent(`Website inquiry from ${name}`);
          const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
          window.location.href = `mailto:${fallbackEmail}?subject=${subject}&body=${body}`;
          setFormStatus(status, "success", "Opening your email client to send the message.");
          return;
        }

        setFormStatus(
          status,
          "error",
          "Form endpoint not configured yet. Set PARAMETERS.contactEndpoint (e.g., Formspree URL) or PARAMETERS.contactEmail in index.html."
        );
      });
    }

    function applyParameters(params) {
      document.title = `${params.name} — Medical Physics & Research`;
      document.getElementById("brand-name").textContent = params.name;
      document.getElementById("profile-name").textContent = params.name;
      document.getElementById("footer-name").textContent = params.name;
      document.getElementById("profile-headline").textContent = params.headline;
      document.getElementById("profile-tagline").textContent = params.tagline;

      const customBg = (params.backgroundImageUrl || "").trim();
      if (customBg) {
        document.body.classList.add("has-custom-bg");
        document.body.style.backgroundImage =
          `linear-gradient(180deg, rgba(235, 244, 252, 0.84) 0%, rgba(226, 239, 250, 0.90) 100%), url("${customBg}")`;
      }

      const linksHtml = buildProfileLinksHtml(params);
      document.getElementById("about-links").innerHTML = linksHtml;
      document.getElementById("research-links").innerHTML = linksHtml;
      document.getElementById("contact-links").innerHTML = linksHtml;

      const avatarWrap = document.getElementById("avatar-wrap");
      avatarWrap.innerHTML = "";
      const img = document.createElement("img");
      img.src = params.avatarUrl;
      img.alt = `Portrait of ${params.name}`;
      img.onerror = () => {
        avatarWrap.innerHTML = `<span style="font-weight:600;color:#1b5e8a;font-size:1.5rem;">${params.initials}</span>`;
      };
      avatarWrap.appendChild(img);

      document.getElementById("profile-bio").innerHTML = params.bio
        .map((p) => `<p>${p}</p>`)
        .join("");

      document.getElementById("research-intro").textContent = params.researchIntro;
      renderCards("research-list", params.publications);

      document.getElementById("projects-intro").textContent = params.projectsIntro;
      renderCards("projects-list", params.experience);

      document.getElementById("collaboration-intro").textContent = params.collaborationIntro;
      renderCards("collaboration-list", params.collaboration);

      document.getElementById("contact-intro").textContent = params.contactIntro;

      setupContactForm(params);
    }

    (function () {
      applyParameters(PARAMETERS);

      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
      const brandLink = document.querySelector('[data-tab-link="about"]');

      function activateTab(tabName, updateHash = true) {
        const valid = tabs.some((t) => t.dataset.tab === tabName);
        const target = valid ? tabName : "about";

        tabs.forEach((tab) => {
          const isSelected = tab.dataset.tab === target;
          tab.setAttribute("aria-selected", String(isSelected));
        });

        panels.forEach((panel) => {
          panel.classList.toggle("is-active", panel.id === "panel-" + target);
        });

        if (updateHash) {
          history.replaceState(null, "", "#" + target);
        }
      }

      tabs.forEach((tab, idx) => {
        tab.addEventListener("click", () => activateTab(tab.dataset.tab));
        tab.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            const next = tabs[(idx + 1) % tabs.length];
            next.focus();
            activateTab(next.dataset.tab);
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            const prev = tabs[(idx - 1 + tabs.length) % tabs.length];
            prev.focus();
            activateTab(prev.dataset.tab);
          }
        });
      });

      if (brandLink) {
        brandLink.addEventListener("click", (e) => {
          e.preventDefault();
          activateTab("about");
        });
      }

      window.addEventListener("hashchange", () => {
        activateTab(location.hash.replace(/^#/, ""), false);
      });

      activateTab(location.hash.replace(/^#/, "") || "about", false);

      document.getElementById("year").textContent = new Date().getFullYear();
    })();
  </script>
